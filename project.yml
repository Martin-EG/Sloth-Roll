name: SlothRoll
options:
  bundleIdPrefix: com.martinespericueta
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: HYZ2GHP9BH
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    minorVersion: 3.32.3
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    minorVersion: 0.32.3
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
targets:
  SlothRoll:
    type: application
    platform: iOS
    sources:
      - path: SlothRoll
        excludes:
          - "**/.gitkeep"
    info:
      path: SlothRoll/Resources/Info.plist
      properties:
        CFBundleDisplayName: Sloth Roll
        NSPhotoLibraryUsageDescription: Sloth Roll reads your screenshots on this iPhone to turn them into events, places, and expenses. Nothing leaves the device.
        NSCalendarsWriteOnlyAccessUsageDescription: Sloth Roll adds events from your screenshots to your calendar. It can't read your existing events.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSRequiresIPhoneOS: true
    entitlements:
      path: SlothRoll/Resources/SlothRoll.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martinespericueta.slothroll
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: mlx-swift
        product: MLX
      - package: mlx-swift-lm
        product: MLXVLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
  SlothRollTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SlothRollTests
        excludes:
          - "**/.gitkeep"
    dependencies:
      - target: SlothRoll
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martinespericueta.slothroll.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SlothRoll.app/SlothRoll"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  SlothRoll:
    build:
      targets:
        SlothRoll: all
        SlothRollTests: [test]
    test:
      targets:
        - SlothRollTests
